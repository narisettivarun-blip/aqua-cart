<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqua Cart - Admin Panel</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="admin-body">

<!-- ADMIN LOGIN -->
<div id="adminLoginWrap" class="admin-login-wrap">
  <div class="login-card glass-card">
    <h2 style="margin-bottom:20px; text-align:center;">&#128737;&#65039; Admin Login</h2>
    <div class="msg-box msg-error" id="adminLoginError"></div>
    <form onsubmit="event.preventDefault(); adminLogin();">
      <div class="input-box">
        <input type="email" id="adminEmail" required>
        <label>Admin Email</label>
      </div>
      <div class="input-box">
        <input type="password" id="adminPassword" required>
        <label>Password</label>
      </div>
      <button type="submit" class="btn-submit">Sign In</button>
    </form>
    <p style="text-align:center; margin-top:15px; font-size:12px; opacity:0.8;">
      Default: admin@aquacart.com / Admin@123
    </p>
    <p style="text-align:center; margin-top:8px;"><a href="/">&larr; Back to Aqua Cart</a></p>
  </div>
</div>

<!-- ADMIN DASHBOARD -->
<div id="adminDashboard" style="display:none;">
  <div class="admin-header">
    <h2>&#128737;&#65039; Aqua Cart Admin Panel</h2>
    <div>
      <span id="adminNameLabel" style="margin-right:15px; font-size:14px;"></span>
      <button class="btn-secondary" onclick="adminLogout()">Logout</button>
    </div>
  </div>

  <div class="admin-container">
    <div class="stat-grid" id="statGrid"></div>

    <div class="admin-tabs">
      <button class="active" id="tabPending" onclick="switchTab('pending')">Pending Approvals</button>
      <button id="tabApproved" onclick="switchTab('approved')">Approved Users</button>
      <button id="tabRejected" onclick="switchTab('rejected')">Rejected Users</button>
      <button id="tabListings" onclick="switchTab('listings')">All Listings</button>
      <button id="tabPrices" onclick="switchTab('prices')">&#128202; Market Prices</button>
    </div>

    <div id="tabContent"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
